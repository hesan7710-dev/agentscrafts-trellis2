name: Validate worker source
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile worker source
        run: python -m py_compile worker.py
      - name: Validate prompt library JSON
        if: ${{ hashFiles('prompts.json') != '' }}
        run: python -m json.tool prompts.json > /dev/null
